services:
  web:
    image: gitea.xiaohe.team/lzhshou/xiaohe-plane-web:v1.5.0-xh27
    mem_limit: 384m
    restart: unless-stopped
    volumes:
      - ./web-Caddyfile:/etc/caddy/Caddyfile:ro
  space:
    mem_limit: 192m
    restart: unless-stopped
  admin:
    mem_limit: 192m
    restart: unless-stopped
  live:
    mem_limit: 192m
    restart: unless-stopped
  api:
    image: gitea.xiaohe.team/lzhshou/xiaohe-plane-backend:v1.5.0-xh26
    mem_limit: 1g
    restart: unless-stopped
    # 上游镜像把 --max-requests 写死在入口脚本里，且 gunicorn 命令行参数优先级高于
    # GUNICORN_CMD_ARGS，只能用本仓参数化后的入口脚本挂载覆盖。
    command: ./bin/docker-entrypoint-api-xh.sh
    volumes:
      - ./docker-entrypoint-api-xh.sh:/code/bin/docker-entrypoint-api-xh.sh:ro
    extra_hosts:
      - "accounts.xiaohe.team:host-gateway"
    environment:
      XIAOHE_ACCOUNTS_URL: https://accounts.xiaohe.team
      XIAOHE_OAUTH_CLIENT_ID: plane
      XIAOHE_OAUTH_REDIRECT: https://plane.xiaohe.team/auth/xiaohe/callback/
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-5000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-1000}
      # Request guard: per-user token buckets (Redis) and a short read cache.
      # Every knob is a runtime env var so a limit can be relaxed without a
      # rebuild; set XIAOHE_THROTTLE_ENABLED=0 / XIAOHE_READ_CACHE_ENABLED=0 to
      # switch a layer off entirely.
      XIAOHE_BUILD_ID: ${XIAOHE_BUILD_ID:-v1.5.0-xh25}
      XIAOHE_USER_RATE: ${XIAOHE_USER_RATE:-5}
      XIAOHE_USER_BURST: ${XIAOHE_USER_BURST:-40}
      XIAOHE_BOT_RATE: ${XIAOHE_BOT_RATE:-2}
      XIAOHE_BOT_BURST: ${XIAOHE_BOT_BURST:-20}
      XIAOHE_RATE_WARN_PER_MIN: ${XIAOHE_RATE_WARN_PER_MIN:-300}
      XIAOHE_READ_CACHE_TTL: ${XIAOHE_READ_CACHE_TTL:-3}
  worker:
    mem_limit: 384m
    restart: unless-stopped
  beat-worker:
    mem_limit: 192m
    restart: unless-stopped
  migrator:
    mem_limit: 384m
    restart: "no"
  plane-db:
    mem_limit: 1024m
    restart: unless-stopped
  plane-redis:
    mem_limit: 192m
    restart: unless-stopped
  plane-mq:
    mem_limit: 192m
    restart: unless-stopped
  plane-minio:
    mem_limit: 192m
    restart: unless-stopped
  proxy:
    mem_limit: 128m
    restart: unless-stopped
    # Staging: bind to loopback or tailnet only. Expose through nginx after DNS and auth are set.
    ports: !override
      - "${PLANE_BIND_IP:-127.0.0.1}:8080:80"
